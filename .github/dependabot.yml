# Keeps GitHub Actions (SHA-pinned) and the toolchain image digest current.
# C projects have no package manifests (make and the compiler only), and Dependabot has no
# C ecosystem, so only actions and the image digest are tracked.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # The release line (C17 (GCC 16 in the container)) is a deliberate choice shared with the native CI and
    # `make toolchain`; Dependabot refreshes digests but never changes minor or major versions.
    ignore:
      - dependency-name: "*"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
